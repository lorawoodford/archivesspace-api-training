http:
  method: GET
  url: "{{PROPUBLICA_URL}}/search.json?q=archives&state[id]={{your_state}}"
  params:
    - name: q
      value: archives
      type: query
    - name: state[id]
      value: "{{your_state}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
