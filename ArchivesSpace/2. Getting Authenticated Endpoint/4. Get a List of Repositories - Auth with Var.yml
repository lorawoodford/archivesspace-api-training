info:
  name: 4. Get a List of Repositories - Auth with Var
  type: http
  seq: 4

http:
  method: GET
  url: "{{ASPACE_BACKEND_URL}}/repositories/2/resources/16"
  headers:
    - name: X-ArchivesSpace-Session
      value: "{{SESSION}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: https://archivesspace.github.io/archivesspace/api/#get-a-list-of-resources-for-a-repository
