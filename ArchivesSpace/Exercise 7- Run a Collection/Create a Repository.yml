info:
  name: Create a Repository
  type: http
  seq: 2

http:
  method: POST
  url: "{{ASPACE_BACKEND_URL}}/repositories"
  headers:
    - name: X-ArchivesSpace-Session
      value: "{{SESSION}}"
  body:
    type: json
    data: |-
      {
        "name": "{{USER}}'s Test repository",
        "is_slug_auto": true,
        "repo_code": "{{usernameCleaned}}_repo",
        "country": "US"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        let originalVar = bru.getEnvVar("USER");
        let cleanVar = originalVar.replace(/[^a-zA-Z0-9]/g, ""); 
        bru.setVar("usernameCleaned", cleanVar);
    - type: after-response
      code: |-
        const repository_id = res.getBody().id;

        bru.setVar("REPOSITORY_ID", repository_id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
