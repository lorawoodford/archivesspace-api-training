http:
  method: POST
  url: "{{ASPACE_BACKEND_URL}}/repositories/2/resources/{{YOUR_RESOURCE_ID}}"
  headers:
    - name: X-ArchivesSpace-Session
      value: "{{SESSION}}"
  body:
    type: json
    data: ""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: https://archivesspace.github.io/archivesspace/api/#update-a-resource
