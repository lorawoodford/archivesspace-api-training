info:
  name: 1. Get a Resource
  type: http
  seq: 1

http:
  method: GET
  url: "{{ASPACE_BACKEND_URL}}/repositories/2/resources/{{YOUR_RESOURCE_ID}}"
  headers:
    - name: X-ArchivesSpace-Session
      value: "{{SESSION}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: https://archivesspace.github.io/archivesspace/api/#get-a-resource
